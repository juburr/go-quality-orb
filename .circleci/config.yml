version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.5
  shellcheck: circleci/shellcheck@3.4

filters: &filters
  tags:
    only: /.*/

jobs:
  # Runs every tool's install.sh against fixture releases, offline: the shared install contract for
  # Go, golangci-lint, gotestsum and gofumpt, the download_base_url mirror and Go's whole-tree
  # install, that the parts every tool's script shares are identical, and benchstat's build.
  test-install:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run install tests
          command: bash tests/install_test.sh
      - run:
          name: Run benchstat install tests
          command: bash tests/install_benchstat_test.sh
  test-env-subst:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run circleci env subst tests
          command: bash tests/env_subst_test.sh
      - run:
          name: Run shell conventions test
          command: bash tests/shell_conventions_test.sh
  # Runs the command scripts, with PARAM_* set from each command's YAML, with the real go and
  # gofmt against tests/fixtures and stand-ins for golangci-lint, gotestsum, gofumpt and
  # benchstat: findings, report_only, tools that don't complete, the arguments each tool gets
  # and the reports. Then checks that each command's YAML passes every parameter its script reads.
  test-commands:
    docker:
      - image: cimg/go:1.27
    steps:
      - checkout
      - run:
          name: Run command tests
          command: bash tests/commands_test.sh
      - run:
          name: Run wiring test
          command: bash tests/wiring_test.sh

workflows:
  lint-pack:
    jobs:
      - test-install:
          filters: *filters
      - test-env-subst:
          filters: *filters
      - test-commands:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: go-quality
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: go-quality-orb
          requires: [test-install, test-env-subst, test-commands, orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
