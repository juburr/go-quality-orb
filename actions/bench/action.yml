name: Compare Go benchmarks
description: >
  Runs the benchmarks of each module and summarizes them with benchstat when
  it is installed. With base_ref, it runs them on that commit too, in a git
  worktree on the same machine, one run of each in turn so both see the same
  load, and compares them with benchstat (install it with install_benchstat).
  Benchmarks are noisy on shared machines, so this reports and never fails on
  a slowdown unless max_regression is set; a benchmark that fails, or a
  package that doesn't build, always fails the step. The GitHub Actions twin
  of the orb's bench command.
author: juburr

inputs:
  base_ref:
    description: >
      A git revision to compare with, such as origin/main or a commit, which
      must be in the checkout (fetch it in an earlier step). Empty runs this
      commit's benchmarks only.
    default: ""
  bench:
    description: >
      Run the benchmarks matching this regular expression (go test -bench).
    default: .
  benchmem:
    description: >
      Report memory allocations per operation too (go test -benchmem).
    default: "true"
  benchtime:
    description: >
      Run each benchmark for this long (go test -benchtime), such as 2s, or
      this many times, such as 1000x. Empty keeps go test's 1s.
    default: ""
  count:
    description: >
      Run each benchmark this many times (go test -count), on each side of a
      comparison. benchstat needs at least 6 runs to compute confidence
      intervals, and 10 or more makes small changes visible.
    default: "6"
  cpu:
    description: >
      Run each benchmark with each of these GOMAXPROCS values (go test -cpu),
      such as 1,4.
    default: ""
  extra_args:
    description: >
      More go test arguments, split like shell words. Nothing in them is
      expanded or run. -bench, -count, -run and -json are refused, since this
      command sets them.
    default: ""
  max_regression:
    description: >
      Fail the step when a benchmark's time, memory or allocations per
      operation is worse than at base_ref by more than this percentage, such
      as 10, and benchstat says the change is significant. Empty reports
      without failing.
    default: ""
  modules:
    description: >
      The modules to check: directories that hold a go.mod, relative to
      working_dir, separated by commas or spaces; or all, for every module in
      working_dir and below it, skipping vendor and testdata directories and
      those whose names start with "." or "_", as go ./... patterns do.
    default: .
  no_output_timeout:
    description: >
      CircleCI's no_output_timeout for this command's step, kept so the inputs
      match the command. It has no effect on GitHub Actions; set
      timeout-minutes on the job or step instead.
    default: 10m
  output_dir:
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to the
      artifact upload.
    default: /tmp/go-quality-reports
  packages:
    description: >
      The package patterns to benchmark in each module, separated by commas or
      spaces.
    default: ./...
  report_name:
    description: >
      The reports' file name, without extension: <report_name>.txt (this
      commit's results), .base.txt, .log, .benchstat.txt and .benchstat.csv.
      Give each run of this command in a job its own.
    default: go-bench
  report_only:
    description: >
      Report findings without failing the step, to adopt the check gradually.
      A benchmark that fails still fails it.
    default: "false"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact, named
      go-quality-reports-<report_name> and a random suffix, including when the
      step fails.
    default: "true"
  tags:
    description: >
      Build tags (go -tags), separated by commas.
    default: ""
  timeout:
    description: >
      Fail a test binary that runs longer than this (go test -timeout). Empty
      keeps go test's 10m.
    default: ""
  working_dir:
    description: >
      Directory to run in: modules are relative to it.
    default: .

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=go-quality-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: go test -bench
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_BASE_REF: ${{ inputs.base_ref }}
        PARAM_BENCH: ${{ inputs.bench }}
        PARAM_BENCHMEM: ${{ inputs.benchmem }}
        PARAM_BENCHTIME: ${{ inputs.benchtime }}
        PARAM_COUNT: ${{ inputs.count }}
        PARAM_CPU: ${{ inputs.cpu }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_MAX_REGRESSION: ${{ inputs.max_regression }}
        PARAM_MODULES: ${{ inputs.modules }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_PACKAGES: ${{ inputs.packages }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_REPORT_ONLY: ${{ inputs.report_only }}
        PARAM_TAGS: ${{ inputs.tags }}
        PARAM_TIMEOUT: ${{ inputs.timeout }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/bench.sh"
        "SCRIPT_GO_QUALITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/go_quality.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
