name: Build Go packages
description: >
  Checks that each module builds for every platform in platforms, with go
  build -o /dev/null for each GOOS/GOARCH pair, which compiles every package
  and keeps nothing. Code for one platform only, behind build tags or in
  _<os>.go and _<arch>.go files, is checked without a machine for it. The step
  fails when a module doesn't build for a platform, unless report_only is
  true; a platform this Go can't build for fails it before anything is built.
  The GitHub Actions twin of the orb's build command.
author: juburr

inputs:
  cgo:
    description: >
      Build with cgo (CGO_ENABLED=1), which cross-compiling needs a C
      cross-compiler for. Off by default, as for most cross-compiled Go.
    default: "false"
  extra_args:
    description: >
      More go build arguments, split like shell words. Nothing in them is
      expanded or run. For example -trimpath. -o is refused, since this
      command keeps nothing it builds.
    default: ""
  junit:
    description: >
      Also write JUnit XML, one test case per module and platform, for a JUnit
      reader such as a test report action.
    default: "true"
  modules:
    description: >
      The modules to check: directories that hold a go.mod, relative to
      working_dir, separated by commas or spaces; or all, for every module in
      working_dir and below it, skipping vendor and testdata directories and
      those whose names start with "." or "_", as go ./... patterns do.
    default: .
  output_dir:
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to the
      artifact upload.
    default: /tmp/go-quality-reports
  packages:
    description: >
      The package patterns to build in each module, separated by commas or
      spaces.
    default: ./...
  platforms:
    description: >
      The GOOS/GOARCH pairs to build for, separated by commas or spaces, as go
      tool dist list prints them, such as linux/amd64 darwin/arm64
      windows/amd64.
    default: linux/amd64,linux/arm64
  report_name:
    description: >
      The reports' file name, without extension: <report_name>.log and
      junit/<report_name>.xml. Give each run of this command in a job its own.
    default: go-build
  report_only:
    description: >
      Report findings without failing the step, to adopt the check gradually.
      A platform this Go can't build for still fails it.
    default: "false"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact, named
      go-quality-reports-<report_name> and a random suffix, including when the
      step fails.
    default: "true"
  tags:
    description: >
      Build tags (go -tags), separated by commas.
    default: ""
  working_dir:
    description: >
      Directory to run in: modules are relative to it.
    default: .

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=go-quality-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: go build
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_CGO: ${{ inputs.cgo }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_JUNIT: ${{ inputs.junit }}
        PARAM_MODULES: ${{ inputs.modules }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_PACKAGES: ${{ inputs.packages }}
        PARAM_PLATFORMS: ${{ inputs.platforms }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_REPORT_ONLY: ${{ inputs.report_only }}
        PARAM_TAGS: ${{ inputs.tags }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/build.sh"
        "SCRIPT_GO_QUALITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/go_quality.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
