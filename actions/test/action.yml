name: Run Go tests
description: >
  Runs the tests of each module with gotestsum, which runs go test and writes
  JUnit XML for a JUnit reader, with go test's JSON events and a coverage
  profile, its summary and an HTML view per module. It can run the tests with
  the race detector, in a shuffled order, again when they fail (to tell flaky
  tests apart), split across parallel nodes by timing, and fail when total
  coverage is below coverage_min. A failing test, or a package that doesn't
  build, fails the step. Install gotestsum first (the install command does by
  default). The GitHub Actions twin of the orb's test command.
author: juburr

inputs:
  count:
    description: >
      Run each test this many times (go test -count). 1, the default, also
      keeps go test from reusing cached results.
    default: "1"
  coverage:
    description: >
      Write a coverage profile per module (go test -coverprofile), with its
      summary (go tool cover -func) and an HTML view, and print the total.
    default: "true"
  coverage_min:
    description: >
      Fail the step when the share of statements the tests cover, over every
      module, is below this percentage, such as 80. Empty checks nothing. It
      can't be checked with split_tests across more than one node.
    default: ""
  covermode:
    description: >
      How coverage is counted (go test -covermode). Empty keeps go test's
      default: set, or atomic with race.
    default: ""
  coverpkg:
    description: >
      Count coverage in these packages, not only in the package under test (go
      test -coverpkg), such as ./... for every package of the module.
    default: ""
  extra_args:
    description: >
      More go test arguments, split like shell words. Nothing in them is
      expanded or run. -json and -coverprofile are refused, since gotestsum
      and coverage set them.
    default: ""
  format:
    description: >
      How gotestsum prints the results (gotestsum --format): pkgname,
      pkgname-and-test-fails, testname, dots, standard-verbose, and the others
      gotestsum lists.
    default: pkgname-and-test-fails
  junit:
    description: >
      Also write JUnit XML, one test case per test, written by gotestsum, for
      a JUnit reader such as a test report action.
    default: "true"
  modules:
    description: >
      The modules to check: directories that hold a go.mod, relative to
      working_dir, separated by commas or spaces; or all, for every module in
      working_dir and below it, skipping vendor and testdata directories and
      those whose names start with "." or "_", as go ./... patterns do.
    default: .
  no_output_timeout:
    description: >
      CircleCI's no_output_timeout for this command's step, kept so the inputs
      match the command. It has no effect on GitHub Actions; set
      timeout-minutes on the job or step instead.
    default: 10m
  output_dir:
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to the
      artifact upload.
    default: /tmp/go-quality-reports
  packages:
    description: >
      The package patterns to test in each module, separated by commas or
      spaces.
    default: ./...
  race:
    description: >
      Run the tests with the race detector (go test -race). It needs cgo and a
      C compiler, which cimg/go has, and makes tests several times slower.
    default: "false"
  report_name:
    description: >
      The reports' file name, without extension:
      <report_name>/<module>/events.json, coverage.out, coverage.txt and
      coverage.html, and junit/<report_name>/<module>/junit.xml. Give each run
      of this command in a job its own.
    default: go-test
  rerun_fails:
    description: >
      Run failed tests again, up to this many times, and pass when they pass
      (gotestsum --rerun-fails), with a report of the tests that needed it. 0
      runs nothing again. gotestsum doesn't rerun when more than 10 tests
      fail.
    default: "0"
  run:
    description: >
      Only run the tests matching this regular expression (go test -run).
    default: ""
  short:
    description: >
      Tell long-running tests to shorten their run time (go test -short).
    default: "false"
  shuffle:
    description: >
      Run tests and benchmarks in a random order (go test -shuffle): off, on,
      or a seed to repeat an order gotestsum printed.
    default: "off"
  skip:
    description: >
      Skip the tests matching this regular expression (go test -skip).
    default: ""
  split_tests:
    description: >
      CircleCI only: with a job parallelism above 1, run only this node's
      share of the packages, split by the timings of earlier JUnit results
      (circleci tests split). GitHub Actions has no such parallelism, so it
      has no effect there; split packages across a matrix with packages
      instead.
    default: "false"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact, named
      go-quality-reports-<report_name> and a random suffix, including when the
      step fails.
    default: "true"
  tags:
    description: >
      Build tags (go -tags), separated by commas.
    default: ""
  timeout:
    description: >
      Fail a test binary that runs longer than this (go test -timeout), such
      as 20m. Empty keeps go test's 10m.
    default: ""
  working_dir:
    description: >
      Directory to run in: modules are relative to it.
    default: .

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=go-quality-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: go test
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_COUNT: ${{ inputs.count }}
        PARAM_COVERAGE: ${{ inputs.coverage }}
        PARAM_COVERAGE_MIN: ${{ inputs.coverage_min }}
        PARAM_COVERMODE: ${{ inputs.covermode }}
        PARAM_COVERPKG: ${{ inputs.coverpkg }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_FORMAT: ${{ inputs.format }}
        PARAM_JUNIT: ${{ inputs.junit }}
        PARAM_MODULES: ${{ inputs.modules }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_PACKAGES: ${{ inputs.packages }}
        PARAM_RACE: ${{ inputs.race }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_RERUN_FAILS: ${{ inputs.rerun_fails }}
        PARAM_RUN: ${{ inputs.run }}
        PARAM_SHORT: ${{ inputs.short }}
        PARAM_SHUFFLE: ${{ inputs.shuffle }}
        PARAM_SKIP: ${{ inputs.skip }}
        PARAM_SPLIT_TESTS: ${{ inputs.split_tests }}
        PARAM_TAGS: ${{ inputs.tags }}
        PARAM_TIMEOUT: ${{ inputs.timeout }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/test.sh"
        "SCRIPT_GO_QUALITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/go_quality.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
