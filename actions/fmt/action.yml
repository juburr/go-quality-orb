name: Check Go formatting
description: >
  Checks that the Go files in working_dir and below are formatted, with gofmt
  (the default, which comes with Go) or gofumpt (install it with
  install_gofumpt). It checks every .go file go ./... patterns cover, whatever
  its build tags, skipping vendor and testdata directories and those whose
  names start with "." or "_", and writes the list of unformatted files and
  the changes the formatter would make (<report_name>.diff). The step fails
  when a file isn't formatted, unless report_only is true; it always fails
  when a file can't be parsed. The GitHub Actions twin of the orb's fmt
  command.
author: juburr

inputs:
  exclude:
    description: >
      Directories to skip, relative to working_dir, separated by commas or
      spaces, such as third_party.
    default: ""
  formatter:
    description: >
      gofmt, Go's own formatter, or gofumpt, a stricter superset of it.
    default: gofmt
  junit:
    description: >
      Also write JUnit XML, one failing test case per unformatted file, for a
      JUnit reader such as a test report action.
    default: "true"
  output_dir:
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to the
      artifact upload.
    default: /tmp/go-quality-reports
  report_name:
    description: >
      The reports' file name, without extension: <report_name>.txt (the
      unformatted files), .diff and junit/<report_name>.xml. Give each run of
      this command in a job its own.
    default: gofmt
  report_only:
    description: >
      Report findings without failing the step, to adopt the check gradually.
      A file the formatter can't parse still fails it.
    default: "false"
  simplify:
    description: >
      Also require gofmt's simplifications (gofmt -s), such as dropping
      redundant types in composite literals. gofumpt always simplifies.
    default: "false"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact, named
      go-quality-reports-<report_name> and a random suffix, including when the
      step fails.
    default: "true"
  working_dir:
    description: >
      Directory to run in: modules are relative to it, and the files below it
      are checked.
    default: .

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=go-quality-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: Check formatting
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_EXCLUDE: ${{ inputs.exclude }}
        PARAM_FORMATTER: ${{ inputs.formatter }}
        PARAM_JUNIT: ${{ inputs.junit }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_REPORT_ONLY: ${{ inputs.report_only }}
        PARAM_SIMPLIFY: ${{ inputs.simplify }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/fmt.sh"
        "SCRIPT_GO_QUALITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/go_quality.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
