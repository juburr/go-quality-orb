name: Run golangci-lint
description: >
  Runs golangci-lint 2 in each module, with the module's own configuration
  (.golangci.yml, found the way golangci-lint finds it, or config), and writes
  its issues as JSON, SARIF and JUnit, with paths relative to working_dir. The
  step fails when golangci-lint finds issues, unless report_only is true; it
  always fails when golangci-lint can't complete: code that doesn't compile
  (typecheck issues), a configuration it can't load, or a module whose go line
  asks for a newer Go than golangci-lint was built with. Install golangci-lint
  first (the install command does by default). The GitHub Actions twin of the
  orb's lint command.
author: juburr

inputs:
  config:
    description: >
      A golangci-lint configuration file to use for every module
      (golangci-lint --config), relative to working_dir. It must be a version
      2 configuration; golangci-lint migrate converts an older one. Empty lets
      golangci-lint find the module's own.
    default: ""
  extra_args:
    description: >
      More golangci-lint run arguments, split like shell words. Nothing in
      them is expanded or run. --output.*, --path-prefix, --path-mode and
      --issues-exit-code are refused, since this command sets the outputs it
      reads.
    default: ""
  junit:
    description: >
      Also write JUnit XML, one failing test case per issue, for a JUnit
      reader such as a test report action.
    default: "true"
  modules:
    description: >
      The modules to check: directories that hold a go.mod, relative to
      working_dir, separated by commas or spaces; or all, for every module in
      working_dir and below it, skipping vendor and testdata directories and
      those whose names start with "." or "_", as go ./... patterns do.
    default: .
  new_from_rev:
    description: >
      Report only issues in code changed since this git revision
      (golangci-lint --new-from-rev), such as origin/main, to gate a pull
      request on the issues it adds.
    default: ""
  output_dir:
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to the
      artifact upload.
    default: /tmp/go-quality-reports
  packages:
    description: >
      The package patterns to lint in each module, separated by commas or
      spaces.
    default: ./...
  report_name:
    description: >
      The reports' file name, without extension: <report_name>.json, .sarif,
      .log and junit/<report_name>.xml. Give each run of this command in a job
      its own.
    default: golangci-lint
  report_only:
    description: >
      Report findings without failing the step, to adopt the check gradually.
      A golangci-lint that can't complete still fails it.
    default: "false"
  sarif:
    description: >
      Also write a SARIF 2.1.0 report, <report_name>.sarif, with a run per
      module.
    default: "true"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact, named
      go-quality-reports-<report_name> and a random suffix, including when the
      step fails.
    default: "true"
  timeout:
    description: >
      Stop golangci-lint after this long (golangci-lint --timeout), such as
      5m. Empty means no timeout.
    default: ""
  working_dir:
    description: >
      Directory to run in: modules are relative to it.
    default: .

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=go-quality-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: golangci-lint run
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_CONFIG: ${{ inputs.config }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_JUNIT: ${{ inputs.junit }}
        PARAM_MODULES: ${{ inputs.modules }}
        PARAM_NEW_FROM_REV: ${{ inputs.new_from_rev }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_PACKAGES: ${{ inputs.packages }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_REPORT_ONLY: ${{ inputs.report_only }}
        PARAM_SARIF: ${{ inputs.sarif }}
        PARAM_TIMEOUT: ${{ inputs.timeout }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/lint.sh"
        "SCRIPT_GO_QUALITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/go_quality.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
