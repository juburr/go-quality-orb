description: >
  Checks that each module builds for every platform in platforms, with go
  build -o /dev/null for each GOOS/GOARCH pair, which compiles every package
  and keeps nothing. Code for one platform only, behind build tags or in
  _<os>.go and _<arch>.go files, is checked without a machine for it. The step
  fails when a module doesn't build for a platform, unless report_only is
  true; a platform this Go can't build for fails it before anything is built.
parameters:
  working_dir:
    type: string
    default: "."
    description: >
      Directory to run in: modules are relative to it.
  modules:
    type: string
    default: "."
    description: >
      The modules to check: directories that hold a go.mod, relative to
      working_dir, separated by commas or spaces; or all, for every module in
      working_dir and below it, skipping vendor and testdata directories and
      those whose names start with "." or "_", as go ./... patterns do.
      Environment variables are expanded.
  packages:
    type: string
    default: "./..."
    description: >
      The package patterns to build in each module, separated by commas or
      spaces. Environment variables are expanded.
  platforms:
    type: string
    default: "linux/amd64,linux/arm64"
    description: >
      The GOOS/GOARCH pairs to build for, separated by commas or spaces, as go
      tool dist list prints them, such as linux/amd64 darwin/arm64
      windows/amd64. Environment variables are expanded.
  cgo:
    type: boolean
    default: false
    description: >
      Build with cgo (CGO_ENABLED=1), which cross-compiling needs a C
      cross-compiler for. Off by default, as for most cross-compiled Go.
  tags:
    type: string
    default: ""
    description: >
      Build tags (go -tags), separated by commas. Environment variables are
      expanded.
  extra_args:
    type: string
    default: ""
    description: >
      More go build arguments, split like shell words. Nothing in them is
      expanded or run; environment variables are expanded before splitting.
      Such as -trimpath. -o is refused, since this command keeps nothing it
      builds.
  output_dir:
    type: string
    default: /tmp/go-quality-reports
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to
      store_artifacts and store_test_results.
  report_name:
    type: string
    default: go-build
    description: >
      The reports' file name, without extension: <report_name>.log and
      junit/<report_name>.xml. Give each run of this command in a job its own.
  junit:
    type: boolean
    default: true
    description: >
      Also write JUnit XML, one test case per module and platform, and show it
      in CircleCI's Tests tab.
  report_only:
    type: boolean
    default: false
    description: >
      Report findings without failing the step, to adopt the check gradually.
      A platform this Go can't build for still fails it.
  store_artifacts:
    type: boolean
    default: true
    description: Store output_dir as job artifacts under go-quality-reports/, including when the step fails.
steps:
  - run:
      name: go build for << parameters.platforms >>
      working_directory: << parameters.working_dir >>
      environment:
        PARAM_CGO: << parameters.cgo >>
        PARAM_EXTRA_ARGS: << parameters.extra_args >>
        PARAM_JUNIT: << parameters.junit >>
        PARAM_MODULES: << parameters.modules >>
        PARAM_OUTPUT_DIR: << parameters.output_dir >>
        PARAM_PACKAGES: << parameters.packages >>
        PARAM_PLATFORMS: << parameters.platforms >>
        PARAM_REPORT_NAME: << parameters.report_name >>
        PARAM_REPORT_ONLY: << parameters.report_only >>
        PARAM_TAGS: << parameters.tags >>
        SCRIPT_GO_QUALITY_LIB: << include(scripts/lib/go_quality.sh) >>
      command: << include(scripts/build.sh) >>
  - when:
      condition: << parameters.junit >>
      steps:
        - store_test_results:
            path: << parameters.output_dir >>/junit/<< parameters.report_name >>.xml
            when: always
  - when:
      condition: << parameters.store_artifacts >>
      steps:
        - store_artifacts:
            path: << parameters.output_dir >>
            destination: go-quality-reports
            when: always
